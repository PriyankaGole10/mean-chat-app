@if(isOpen){

<div class="sidebar-backdrop" (click)="onBackdropClick($event)">

  <div class="sidebar" (click)="onSidebarClick($event)">

    <div class="header">
      <h3>User Info</h3>

      <button class="close-btn" (click)="onClose()">✕</button>
    </div>

    <div class="body">

      <img
        class="avatar"
        [src]="user?.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'"
      />

      <h2>{{ user?.username || 'Unknown User' }}</h2>
      <p>{{ user?.email || 'No email' }}</p>

      <div class="actions">

  <div class="action-row">

    <div>
      <h4>Notifications</h4>
      <p>
        {{ isMuted ? 'Notifications muted' : 'Notifications enabled' }}
      </p>
    </div>

    <button
      class="toggle-btn"
      [class.active]="isMuted"
      (click)="onToggleMute()">

      {{ isMuted ? 'Unmute' : 'Mute' }}

    </button>

  </div>

  <div class="action-row danger">

    <div>
      <h4>User Access</h4>
      <p>
        {{ isBlocked ? 'User is blocked' : 'User can send messages' }}
      </p>
    </div>

    <button
      class="toggle-btn danger-btn"
      (click)="onToggleBlock()">

      {{ isBlocked ? 'Unblock' : 'Block' }}

    </button>

  </div>

</div>

    </div>

  </div>

</div>

}
