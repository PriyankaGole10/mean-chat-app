<div class="sidebar">

  <!-- TOP -->

  <div class="sidebar-top">

    <!-- PROFILE -->

    <div
      class="profile-wrapper"
      (click)="toggleProfile()"
    >

      <img
        src="https://i.pravatar.cc/150"
        alt="profile"
      >

      <div class="online-dot"></div>

    </div>

  </div>

  <!-- MENUS -->

  <div class="menus">

    @for(menu of menus; track menu.label){

      <div
        class="menu-item"
        (click)="navigate(menu.route)"
      >

        <mat-icon>
          {{ menu.icon }}
        </mat-icon>

        <span>
          {{ menu.label }}
        </span>

      </div>

    }

  </div>

  <!-- BOTTOM -->

  <div class="sidebar-bottom">

    <div
      class="menu-item logout"
      (click)="logout()"
    >

      <mat-icon>
        logout
      </mat-icon>

      <span>
        Logout
      </span>

    </div>

  </div>

  <!-- PROFILE POPUP -->

  @if(showProfile){

    <div class="profile-popup">

      <div class="popup-header">

        <img
          src="https://i.pravatar.cc/150"
          alt="profile"
        >

        <div>

          <h3>

            {{ currentUser?.username }}

          </h3>

          <p>

            {{ currentUser?.email }}

          </p>

        </div>

      </div>

      <div class="popup-body">

        <div class="info-row">

          <span class="label">
            Status
          </span>

          <span class="value online">
            Online
          </span>

        </div>

        <div class="info-row">

          <span class="label">
            User ID
          </span>

          <span class="value">

            {{ currentUser?._id }}

          </span>

        </div>

      </div>

    </div>

  }

</div>
