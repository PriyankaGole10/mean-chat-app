<!-- ================= GLOBAL HEADER ================= -->
<div class="app-header">

  <div class="app-title">
    Chat App
  </div>

  <div class="app-actions">

    <button (click)="openProfile()" title="Profile">
      👤
    </button>

    <button (click)="openSettings()" title="Settings">
      ⚙
    </button>

    <button (click)="logout()" title="Logout">
      ⎋
    </button>

  </div>

</div>

<!-- ================= CHAT LAYOUT ================= -->
<div class="chat-layout">

  <!-- SIDEBAR -->
  <div class="sidebar"
       [class.hidden]="isMobile && activePanel === 'chat'">

    <app-chat-sidebar
      [conversations]="conversations"
      [selectedConversationId]="selectedConversation?._id"
      [unreadCounts]="unreadCounts"
      [onlineUsers]="onlineUsers"
      [currentUserId]="currentUser._id"
      (openChat)="onChatSelected($event)"
      (createChat)="createConversation($event)"
      (openGroup)="openGroupModal = true">
    </app-chat-sidebar>

  </div>

  <!-- CHAT WINDOW -->
  <div class="chat-window"
       [class.hidden]="isMobile && activePanel === 'list'">

    <!-- BACK BUTTON (MOBILE ONLY - KEEP) -->
    <div class="mobile-header" *ngIf="isMobile && selectedConversation">
      <button (click)="activePanel='list'">←</button>
      <span>{{ selectedConversation?.name }}</span>
    </div>

    <!-- CHAT CONTENT -->
    @if(selectedConversation) {

      <app-chat-window
        [conversation]="selectedConversation"
        [messages]="messages"
        [typingUser]="typingUser"
         [currentUserId]="currentUser._id"
        (sendMessage)="sendMessage($event)"
        (openGroupInfo)="openGroupInfo($event)">
      </app-chat-window>

    } @else {

      <div class="empty-state">
        <h2>Welcome to Chat</h2>
        <p>Select a conversation</p>
      </div>

    }

  </div>

</div>

<!-- ================= GROUP MODAL ================= -->
@if(openGroupModal) {
  <app-group-modal
    [allUsers]="allUsers"
    (close)="openGroupModal = false"
    (create)="createGroupChat($event)">
  </app-group-modal>
}

@if(showProfileModal) {
  <app-profile-modal
    [user]="currentUser"
    (close)="showProfileModal = false">
  </app-profile-modal>
}

@if(showGroupInfoModal){

  <app-group-info-modal

    [group]="selectedGroup"

    (close)="showGroupInfoModal = false">

  </app-group-info-modal>

}
