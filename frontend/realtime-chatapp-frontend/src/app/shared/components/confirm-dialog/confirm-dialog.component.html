<div class="dialog-backdrop" (click)="onCancel()">

    <div class="dialog-card" (click)="$event.stopPropagation()">

        <div class="dialog-header">
            <h3>{{title}}</h3>
        </div>

        <div class="dialog-body">
            <p>{{message}}</p>
        </div>

        <div class="dialog-footer">

            <button class="cancel-btn" (click)="onCancel()">
                {{cancelText}}
            </button>

            <button class="confirm-btn" [class.danger]="danger" (click)="onConfirm()">
                {{confirmText}}
            </button>

        </div>

    </div>

</div>
