name: Docker CI

on:
  push:
    branches:
      - devops-learning

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Backend
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      # Frontend
      - name: Install Frontend Dependencies
        working-directory: ./frontend/realtime-chatapp-frontend
        run: npm install

      - name: Build Angular App
        working-directory: ./frontend/realtime-chatapp-frontend
        run: npm run build

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Build Backend Image
      - name: Build Backend Image
        run: |
          docker build -t priyankagole92/real-time-chat-backend:latest ./backend

      # Build Frontend Image
      - name: Build Frontend Image
        run: |
          docker build -t priyankagole92/real-time-chat-frontend:latest ./frontend/realtime-chatapp-frontend

      # Push Backend
      - name: Push Backend Image
        run: docker push priyankagole92/real-time-chat-backend:latest

      # Push Frontend
      - name: Push Frontend Image
        run: docker push priyankagole92/real-time-chat-frontend:latest